     HOW TO ADD SERVICENOW ARTICLE LINKS
     ─────────────────────────────────────
     Each node in the NODES array below has a `links` property — an
     array of ServiceNow articles associated with that topic.

     To link a node to one or more ServiceNow articles:
       links: [
           { label: 'Article Title',  url: 'https://resgroup.service-now.com/kb?id=kb_article_view&sysparm_article=KBxxxxxxx' },
           { label: 'Second Article', url: 'https://resgroup.service-now.com/kb?id=kb_article_view&sysparm_article=KBxxxxxxx' },

     • Nodes with an empty `links: []` array show a "coming soon" state.
     • Each `desc` field is a short description shown in the side panel.

     HOSTING
     ────────
     • GitHub Pages: enable Pages on the repo branch; use the resulting

     • Local preview:  npx serve .  then open http://localhost:3000
    ════════════════════════════════════════════════════════════════════
    -->
    <style>
        :root {
            --orange : #E87722;
            --dark   : #2B3A4E;
            --bg     : #eef0f3;
            --pw     : 430px;   /* side-panel width */
            --hh     : 0px;     /* no header */
        }

        html { font-size: 125%; }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;

            height: 100vh;
            display: flex;
            flex-direction: column;

        }

        /* ── Header ─────────────────────────────────────────────── */
        .hdr {
            background: #fff;

            align-items: center;

        /* ── Scrollable map area ────────────────────────────────── */
        .map-scroll {
            position: absolute;
            inset: 0;
            overflow: auto;
            padding: 6px 16px 6px;
            transition: right 0.28s ease;
        }
        .map-scroll.shifted { right: var(--pw); }

        /* ══════════════════════════════════════════════════════════
           MIND MAP
        ══════════════════════════════════════════════════════════ */
        .mm-stage {
            position: relative;
            width: 1060px;
            height: 638px;
            margin: 0 auto;
        }

        /* SVG connecting lines */
        .mm-svg {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        .mm-svg line {
            stroke: var(--orange);
            stroke-width: 1.5;
            opacity: 0.45;
            transition: opacity 0.2s, stroke-width 0.2s;
        }
        .mm-svg line.active-line { opacity: 0.9; stroke-width: 2.5; }

        /* Node positioning wrapper */
        .mm-node {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 2;
            user-select: none;
        }
        .mm-node.hub { cursor: default; z-index: 3; }

        /* Node inner box */
        .mm-box {
            border-radius: 8px;
            padding: 9px 14px;
            text-align: center;
            line-height: 1.35;
            transition: background 0.18s, color 0.18s, border-color 0.18s,
                        box-shadow 0.18s, transform 0.18s;
        }

        /* All node variants — dark navy by default */
        .mm-node.v-dark .mm-box,
        .mm-node.v-pill .mm-box,
        .mm-node.v-outlined .mm-box,
        .mm-node.v-light .mm-box {
            background: var(--dark); color: #fff;
            font-size: 0.78rem; font-weight: 600;
        }
        .mm-node.v-dark .mm-box,
        .mm-node.v-outlined .mm-box,
        .mm-node.v-light .mm-box    { min-width: 140px; max-width: 195px; }
        .mm-node.v-pill .mm-box     { min-width: 110px; max-width: 175px; }

        /* Orange border = at least one ServiceNow article is linked */
        .mm-node.has-article .mm-box {
            border: 2.5px solid var(--orange);
        }

        /* Faded state — no articles or community links yet */
        .mm-node.no-article {
            opacity: 0.38;
            transition: opacity 0.2s;
        }
        .mm-node.no-article:hover,
        .mm-node.no-article.sel {
            opacity: 1;
        }

        /* "Start here" pulse on What's Available */
        .start-badge {
            display: block;
            font-size: 0.52rem;
            font-weight: 700;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            color: var(--orange);
            margin-bottom: 3px;
            animation: pulse-badge 2s ease-in-out infinite;
        }
        .mm-node.sel .start-badge,
        .mm-node:hover .start-badge { color: rgba(255,255,255,0.9); animation: none; }
        @keyframes pulse-badge {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.45; }
        }

        /* Hub oval */
        .mm-node.hub .mm-box {
            background: var(--dark); color: #fff;
            border-radius: 50%;
            width: 120px; height: 120px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 0.97rem; font-weight: 700; line-height: 1.25;

            background: var(--orange) !important;
            color: #fff !important;
            border-color: var(--orange) !important;
            box-shadow: 0 4px 20px rgba(232,119,34,0.4);

            top: var(--hh);
            right: calc(-1 * var(--pw));
            width: var(--pw);
            height: calc(100vh - var(--hh));

            box-shadow: -5px 0 30px rgba(0,0,0,0.13);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: right 0.28s ease;

        .panel-head {
            padding: 16px 18px;

            align-items: flex-start;
            justify-content: space-between;
            flex-shrink: 0;

            font-size: 1.5rem;

            opacity: 0.7;

        }
        .playbook-close:hover { opacity: 1; }

        .playbook-frame {
            flex: 1;
            border: none;
            width: 100%;
        }
    </style>
</head>

const HUB = { mx: 50, my: 44 };
const SW = 1060, SH = 638;

let activeId = null;

/* ──────────────────────────────────────────────────────────────
   BUILD — MIND MAP
────────────────────────────────────────────────────────────── */
function buildMindMap() {
    const el = document.getElementById('view-mindmap');

    const lines = NODES.map(n => {
        const origin = n.parent ? NODES.find(p => p.id === n.parent) : HUB;
        const x1 = (origin.mx / 100 * SW).toFixed(1);
        const y1 = (origin.my / 100 * SH).toFixed(1);
        const x2 = (n.mx / 100 * SW).toFixed(1);
        const y2 = (n.my / 100 * SH).toFixed(1);
        return `<line data-id="${n.id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    }).join('');

    const nodes = NODES.map(n => {
        const hasLinks = (n.links && n.links.length > 0) || (n.communityLinks && n.communityLinks.length > 0) || !!n.playbook || !!n.deck;
        const hasArticle = hasLinks ? ' has-article' : ' no-article';
        const badge = n.startHere ? `<span class="start-badge">① Begin here</span>` : '';
        return `
        <div class="mm-node ${n.style}${hasArticle}" id="mm-${n.id}"
             style="left:${n.mx}%;top:${n.my}%"
             onclick="pick('${n.id}')">
            <div class="mm-box">
                ${badge}${n.label}
                ${n.sub ? `<span class="mm-sub">${n.sub}</span>` : ''}
            </div>
        </div>`;
    }).join('');

    el.innerHTML = `
        <div class="mm-stage">
            <svg class="mm-svg" viewBox="0 0 ${SW} ${SH}">${lines}</svg>
            <div class="mm-node hub" style="left:${HUB.mx}%;top:${HUB.my}%">
                <div class="mm-box">AI<br>Knowledge<br>Centre</div>
            </div>
            ${nodes}
        </div>`;
}

/* ──────────────────────────────────────────────────────────────
   SELECTION
────────────────────────────────────────────────────────────── */
function pick(id) {
    const node = NODES.find(n => n.id === id);

    // Playbook nodes open as full-screen overlay instead of side panel
    if (node && node.playbook) {
        openPlaybook(node);
        return;
    }

    if (activeId === id) { closePanel(); return; }
    deactivateAll();
    activeId = id;

    const el = document.getElementById('mm-' + id);
    if (el) el.classList.add('sel');

    document.querySelectorAll('.mm-svg line').forEach(l =>
        l.classList.toggle('active-line', l.dataset.id === id));

    openPanel(node);
}

function deactivateAll() {
    if (!activeId) return;
    const el = document.getElementById('mm-' + activeId);
    if (el) el.classList.remove('sel');
    document.querySelectorAll('.mm-svg line').forEach(l =>
        l.classList.remove('active-line'));
}

/* ──────────────────────────────────────────────────────────────
   SIDE PANEL
────────────────────────────────────────────────────────────── */
function openPanel(node) {
    document.getElementById('pTitle').textContent = node.label;
    document.getElementById('pBody').innerHTML = renderPanelContent(node);
    document.getElementById('panel').classList.add('open');
    document.getElementById('mapScroll').classList.add('shifted');
}

function closePanel() {
    deactivateAll();
    activeId = null;
    document.getElementById('panel').classList.remove('open');
    document.getElementById('mapScroll').classList.remove('shifted');
}

function renderPanelContent(node) {
    let html = '';

    // Description
    if (node.desc) {
        html += `<p class="panel-desc">${node.desc}</p>`;
    }

    const hasLinks          = node.links && node.links.length > 0;
    const hasCommunityLinks = node.communityLinks && node.communityLinks.length > 0;
    const hasDeck           = !!node.deck;

    if (hasLinks || hasCommunityLinks || hasDeck) {
        html += `<hr class="panel-divider">`;

        // Community links section
        if (hasCommunityLinks) {
            html += `<p class="links-label">Communities</p>`;
            html += `<div class="panel-links">`;
            node.communityLinks.forEach(link => {
                html += `
                <a class="sn-btn" href="${link.url}" target="_blank" rel="noopener noreferrer">
                    <span class="btn-label">${link.label}</span>
                    <span class="btn-arrow">→</span>
                </a>`;
            });
            html += `</div>`;
            if (hasLinks) html += `<br>`;
        }

        // Presentation / deck section
        if (hasDeck) {
            html += `<p class="links-label">Presentation</p>`;
            html += `<div class="panel-links">`;
            html += `<button class="deck-btn" onclick="openPlaybook({playbook:'${node.deck.file}'})">
                <span class="btn-icon">▶</span>
                <span class="btn-label">${node.deck.label}</span>
            </button>`;
            html += `</div>`;
            if (hasLinks || hasCommunityLinks) html += `<br>`;
        }

        // Knowledge articles section
        if (hasLinks) {
            html += `<p class="links-label">Knowledge Articles</p>`;
            html += `<div class="panel-links">`;
            node.links.forEach(link => {
                html += `
                <a class="sn-btn" href="${link.url}" target="_blank" rel="noopener noreferrer">
                    <span class="btn-label">${link.label}</span>
                    <span class="btn-arrow">→</span>
                </a>`;
            });
            html += `</div>`;
        }
    } else {
        if (node.desc) html += `<hr class="panel-divider">`;
        html += `
        <div class="state-box">
            <div class="icon">🔗</div>
            <p><strong>Coming soon</strong></p>
            <p>Knowledge articles for this topic are being prepared and will be linked here shortly.</p>
        </div>`;
    }

    return html;
}

/* ──────────────────────────────────────────────────────────────
   PLAYBOOK OVERLAY
────────────────────────────────────────────────────────────── */
function openPlaybook(node) {
    const src = node.playbook || node.file || '';
    const title = node.deckTitle || (src.includes('prompting') ? 'Prompting Playbook' : 'Presentation');
    document.getElementById('playbookFrame').src = src;
    document.getElementById('playbookBarTitle').textContent = title;
    document.getElementById('playbookOverlay').classList.add('open');
}

function closePlaybook(e) {
    // If triggered by clicking the backdrop (not the modal itself), close
    if (e && e.target !== document.getElementById('playbookOverlay')) return;
    document.getElementById('playbookOverlay').classList.remove('open');
    // Clear src after transition so iframe doesn't linger in memory
    setTimeout(() => { document.getElementById('playbookFrame').src = ''; }, 300);
}

/* ──────────────────────────────────────────────────────────────
   KEYBOARD: Escape closes panel or playbook overlay
────────────────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('playbookOverlay').classList.contains('open')) {
        document.getElementById('playbookOverlay').classList.remove('open');
        setTimeout(() => { document.getElementById('playbookFrame').src = ''; }, 300);
    } else if (activeId) {
        closePanel();
    }
});

/* ──────────────────────────────────────────────────────────────
   INIT
────────────────────────────────────────────────────────────── */
buildMindMap();
</script>
</body>
</html>
