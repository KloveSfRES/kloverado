<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Centre – RES</title>
    <!--
    ════════════════════════════════════════════════════════════════════
     AI KNOWLEDGE CENTRE  –  RES
    ════════════════════════════════════════════════════════════════════
     HOW TO ADD SERVICENOW ARTICLE LINKS
     ─────────────────────────────────────
     Each node in the NODES array below has a `links` property — an
     array of ServiceNow articles associated with that topic.

     To link a node to one or more ServiceNow articles:
       links: [
           { label: 'Article Title',  url: 'https://resgroup.service-now.com/kb?id=kb_article_view&sysparm_article=KBxxxxxxx' },
           { label: 'Second Article', url: 'https://resgroup.service-now.com/kb?id=kb_article_view&sysparm_article=KBxxxxxxx' },
       ]

     • Nodes with one or more links get an orange border automatically.
     • Nodes with an empty `links: []` array show a "coming soon" state.
     • Each `desc` field is a short description shown in the side panel.

     HOSTING
     ────────
     • GitHub Pages: enable Pages on the repo branch; use the resulting
       URL in SharePoint's "Embed" web part.
     • Local preview:  npx serve .  then open http://localhost:3000
    ════════════════════════════════════════════════════════════════════
    -->
    <style>
        :root {
            --orange : #E87722;
            --dark   : #2B3A4E;
            --bg     : #eef0f3;
            --pw     : 430px;   /* side-panel width */
            --hh     : 57px;    /* header height */
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ─────────────────────────────────────────────── */
        .hdr {
            background: #fff;
            padding: 0 28px;
            height: var(--hh);
            display: flex;
            align-items: center;
            border-bottom: 3px solid var(--orange);
            flex-shrink: 0;
        }
        .hdr-title { color: var(--orange); font-size: 1.5rem; font-weight: 700; letter-spacing: 0.2px; }

        /* ── Workspace ──────────────────────────────────────────── */
        .workspace { flex: 1; overflow: hidden; position: relative; }

        /* ── Scrollable map area ────────────────────────────────── */
        .map-scroll {
            position: absolute;
            inset: 0;
            overflow: auto;
            padding: 16px 20px 24px;
            transition: right 0.28s ease;
        }
        .map-scroll.shifted { right: var(--pw); }

        /* ══════════════════════════════════════════════════════════
           MIND MAP
        ══════════════════════════════════════════════════════════ */
        .mm-stage {
            position: relative;
            width: 1060px;
            height: 740px;
            margin: 0 auto;
        }

        /* SVG connecting lines */
        .mm-svg {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        .mm-svg line {
            stroke: var(--orange);
            stroke-width: 1.5;
            opacity: 0.45;
            transition: opacity 0.2s, stroke-width 0.2s;
        }
        .mm-svg line.active-line { opacity: 0.9; stroke-width: 2.5; }

        /* Node positioning wrapper */
        .mm-node {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 2;
            user-select: none;
        }
        .mm-node.hub { cursor: default; z-index: 3; }

        /* Node inner box */
        .mm-box {
            border-radius: 8px;
            padding: 9px 14px;
            text-align: center;
            line-height: 1.35;
            transition: background 0.18s, color 0.18s, border-color 0.18s,
                        box-shadow 0.18s, transform 0.18s;
        }

        /* All node variants — dark navy by default */
        .mm-node.v-dark .mm-box,
        .mm-node.v-pill .mm-box,
        .mm-node.v-outlined .mm-box,
        .mm-node.v-light .mm-box {
            background: var(--dark); color: #fff;
            font-size: 0.78rem; font-weight: 600;
        }
        .mm-node.v-dark .mm-box,
        .mm-node.v-outlined .mm-box,
        .mm-node.v-light .mm-box    { min-width: 140px; max-width: 195px; }
        .mm-node.v-pill .mm-box     { min-width: 110px; max-width: 175px; }

        /* Orange border = at least one ServiceNow article is linked */
        .mm-node.has-article .mm-box {
            border: 2.5px solid var(--orange);
        }

        /* Hub oval */
        .mm-node.hub .mm-box {
            background: var(--dark); color: #fff;
            border-radius: 50%;
            width: 120px; height: 120px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 0.97rem; font-weight: 700; line-height: 1.25;
        }

        /* Hover & selected states */
        .mm-node:not(.hub):hover .mm-box,
        .mm-node:not(.hub).sel .mm-box {
            background: var(--orange) !important;
            color: #fff !important;
            border-color: var(--orange) !important;
            box-shadow: 0 4px 20px rgba(232,119,34,0.4);
            transform: scale(1.06);
        }

        .mm-sub {
            display: block;
            font-size: 0.63rem;
            opacity: 0.8;
            margin-top: 4px;
            font-weight: 400;
            line-height: 1.35;
        }

        /* ══════════════════════════════════════════════════════════
           SIDE PANEL
        ══════════════════════════════════════════════════════════ */
        .panel {
            position: fixed;
            top: var(--hh);
            right: calc(-1 * var(--pw));
            width: var(--pw);
            height: calc(100vh - var(--hh));
            background: #fff;
            box-shadow: -5px 0 30px rgba(0,0,0,0.13);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: right 0.28s ease;
        }
        .panel.open { right: 0; }

        .panel-head {
            padding: 16px 18px;
            background: var(--dark); color: #fff;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 10px;
        }
        .panel-head h2 {
            font-size: 0.95rem; font-weight: 700;
            line-height: 1.4; flex: 1;
            letter-spacing: 0.1px;
        }
        .panel-close {
            background: none; border: none; color: #fff;
            font-size: 1.45rem; line-height: 1;
            cursor: pointer; padding: 0 4px;
            opacity: 0.7; flex-shrink: 0;
            margin-top: -1px;
        }
        .panel-close:hover { opacity: 1; }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 22px 20px 28px;
            font-size: 0.88rem;
            line-height: 1.65;
            color: #2a2a2a;
        }

        /* Description paragraph */
        .panel-desc {
            color: #3d3d3d;
            font-size: 0.88rem;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        /* Section label above buttons */
        .links-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            color: var(--dark);
            margin-bottom: 10px;
            opacity: 0.65;
        }

        /* Button stack */
        .panel-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ServiceNow CTA button — RES orange */
        .sn-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--orange);
            color: #fff;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 7px;
            font-size: 0.86rem;
            font-weight: 600;
            line-height: 1.35;
            transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
            box-shadow: 0 2px 8px rgba(232,119,34,0.22);
            gap: 10px;
        }
        .sn-btn:hover {
            background: #cf6918;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(232,119,34,0.35);
        }
        .sn-btn:active { transform: translateY(0); }

        .sn-btn .btn-label { flex: 1; }
        .sn-btn .btn-arrow { flex-shrink: 0; font-size: 1rem; opacity: 0.9; }

        /* Divider between description and links */
        .panel-divider {
            border: none;
            border-top: 1px solid #e8eaed;
            margin: 0 0 20px;
        }

        /* Coming-soon / empty state */
        .state-box {
            text-align: center;
            padding: 44px 22px;
            color: #777;
        }
        .state-box .icon { font-size: 2.4rem; margin-bottom: 14px; }
        .state-box p  { margin-bottom: 8px; line-height: 1.55; }
        .state-box strong { color: var(--dark); }
    </style>
</head>
<body>

<!-- ─── HEADER ──────────────────────────────────────────────── -->
<header class="hdr">
    <h1 class="hdr-title">AI Knowledge Centre</h1>
</header>

<!-- ─── WORKSPACE ──────────────────────────────────────────── -->
<div class="workspace">

    <!-- Scrollable map area -->
    <div class="map-scroll" id="mapScroll">
        <div id="view-mindmap"></div>
    </div>

    <!-- Side panel -->
    <aside class="panel" id="panel">
        <div class="panel-head">
            <h2 id="pTitle">Article</h2>
            <button class="panel-close" onclick="closePanel()" title="Close">×</button>
        </div>
        <div class="panel-body" id="pBody"></div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   KNOWLEDGE NODES
   ─────────────────────────────────────────────────────────────
   id      – unique identifier (keep kebab-case)
   style   – visual variant: v-dark | v-pill | v-outlined | v-light
   label   – display text shown on the node
   sub     – optional subtitle shown smaller beneath the label
   desc    – short description shown in the side panel
   links   – array of ServiceNow articles: { label, url }
             Leave as [] until the article is published.
             Nodes with one or more links get an orange border.
   mx / my – mind-map position as % of the stage (1060 × 740 px)
   parent  – (optional) id of a parent node; draws spoke from that
             node instead of the hub (used for build-agents, published-agents)
═══════════════════════════════════════════════════════════════ */
const NODES = [

    },
    {
        id: 'use-cases', style: 'v-pill',
        label: 'Use Cases, Case Studies & Testimonials',
        desc:  'Real examples of AI in action at RES — from everyday productivity improvements to complex cross-functional workflows, with testimonials from colleagues across the business.',
        links: [
            // { label: 'Use Cases & Case Studies', url: 'https://resgroup.service-now.com/kb?id=kb_article_view&sysparm_article=KBxxxxxxx' },
        ],

    },
    {
        id: 'ai-strategy', style: 'v-pill',
        label: 'AI Strategy',
        desc:  'RES\'s vision and roadmap for AI — our priorities, guiding principles, and the strategic direction for embedding AI capability across the organisation.',
        links: [
            // { label: 'AI Strategy Overview', url: 'https://resgroup.service-now.com/kb?id=kb_article_view&sysparm_article=KBxxxxxxx' },
        ],
        mx: 62, my: 8,
    },
    {
        id: 'before-you-start', style: 'v-outlined',
        label: 'Before You Start',
        sub:   'AUP · AI AUP · Guiderails & ethical guidelines',
        desc:  'Essential reading before using any AI tool at RES — covering the Acceptable Use Policy, AI-specific guidelines, ethical guardrails, and your responsibilities as an AI user.',
        links: [
            { label: 'Guidelines for AI Tools', url: 'https://resproduction.service-now.com/sp?id=kb_article_view&sysparm_article=KB0012040' },
            // { label: 'Acceptable Use Policy', url: 'https://resgroup.service-now.com/kb?id=kb_article_view&sysparm_article=KBxxxxxxx' },
        ],
        mx: 80, my: 17,
    },
    {
        id: 'getting-started', style: 'v-outlined',
        label: 'Getting Started',
        sub:   'How to write a good prompt · How to get a licence',
        desc:  'Practical first steps for getting the most out of AI at RES — including how to write an effective prompt and the process for requesting a tool licence.',
        links: [

            { label: 'How to request access to Claude AI',   url: 'https://resproduction.service-now.com/sp?id=kb_article_view&sysparm_article=KB0012721' },
            { label: 'Getting started with Claude AI',       url: 'https://resproduction.service-now.com/sp?id=kb_article_view&sysparm_article=KB0012726' },
        ],

    },

        links: [

            // { label: 'AI for Code Guidelines', url: 'https://resgroup.service-now.com/kb?id=kb_article_view&sysparm_article=KBxxxxxxx' },
        ],
        mx: 74, my: 67,
    },
    {
        id: 'agentic-ai', style: 'v-dark',

        id: 'prompting-playbook', style: 'v-light',

        links: [

        ],
        mx: 29, my: 90,
    },
    {
        id: 'build-agents', style: 'v-light',
        label: 'How to Build and Deploy Agents',
        desc:  'Technical guidance for building and deploying AI agents within RES — covering approved tooling, architecture patterns, testing, and the governance steps required before go-live.',
        links: [
            // { label: 'Build & Deploy Agents – Guide', url: 'https://resgroup.service-now.com/kb?id=kb_article_view&sysparm_article=KBxxxxxxx' },
        ],
        mx: 52, my: 91,
        parent: 'agentic-ai',
    },
    {
        id: 'published-agents', style: 'v-light',
        label: 'Register of Published Agents',
        desc:  'A live register of AI agents that have been built, reviewed, and approved for use across RES — with details on each agent\'s purpose, owner, and how to access it.',
        links: [
            // { label: 'View the Published Agents Register', url: 'https://resgroup.service-now.com/kb?id=kb_article_view&sysparm_article=KBxxxxxxx' },
        ],
        mx: 72, my: 89,
        parent: 'agentic-ai',
    },
];

const HUB = { mx: 50, my: 46 };
const SW = 1060, SH = 740;

let activeId = null;

/* ──────────────────────────────────────────────────────────────
   BUILD — MIND MAP
────────────────────────────────────────────────────────────── */
function buildMindMap() {
    const el = document.getElementById('view-mindmap');

    const lines = NODES.map(n => {
        const origin = n.parent ? NODES.find(p => p.id === n.parent) : HUB;
        const x1 = (origin.mx / 100 * SW).toFixed(1);
        const y1 = (origin.my / 100 * SH).toFixed(1);
        const x2 = (n.mx / 100 * SW).toFixed(1);
        const y2 = (n.my / 100 * SH).toFixed(1);
        return `<line data-id="${n.id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    }).join('');

    const nodes = NODES.map(n => {
        const hasArticle = n.links && n.links.length > 0 ? ' has-article' : '';
        return `
        <div class="mm-node ${n.style}${hasArticle}" id="mm-${n.id}"
             style="left:${n.mx}%;top:${n.my}%"
             onclick="pick('${n.id}')">
            <div class="mm-box">
                ${n.label}
                ${n.sub ? `<span class="mm-sub">${n.sub}</span>` : ''}
            </div>
        </div>`;
    }).join('');

    el.innerHTML = `
        <div class="mm-stage">
            <svg class="mm-svg" viewBox="0 0 ${SW} ${SH}">${lines}</svg>
            <div class="mm-node hub" style="left:${HUB.mx}%;top:${HUB.my}%">
                <div class="mm-box">AI<br>Knowledge<br>Centre</div>
            </div>
            ${nodes}
        </div>`;
}

/* ──────────────────────────────────────────────────────────────
   SELECTION
────────────────────────────────────────────────────────────── */
function pick(id) {
    if (activeId === id) { closePanel(); return; }
    deactivateAll();
    activeId = id;

    const el = document.getElementById('mm-' + id);
    if (el) el.classList.add('sel');

    document.querySelectorAll('.mm-svg line').forEach(l =>
        l.classList.toggle('active-line', l.dataset.id === id));

    openPanel(NODES.find(n => n.id === id));
}

function deactivateAll() {
    if (!activeId) return;
    const el = document.getElementById('mm-' + activeId);
    if (el) el.classList.remove('sel');
    document.querySelectorAll('.mm-svg line').forEach(l =>
        l.classList.remove('active-line'));
}

/* ──────────────────────────────────────────────────────────────
   SIDE PANEL
────────────────────────────────────────────────────────────── */
function openPanel(node) {
    document.getElementById('pTitle').textContent = node.label;
    document.getElementById('pBody').innerHTML = renderPanelContent(node);
    document.getElementById('panel').classList.add('open');
    document.getElementById('mapScroll').classList.add('shifted');
}

function closePanel() {
    deactivateAll();
    activeId = null;
    document.getElementById('panel').classList.remove('open');
    document.getElementById('mapScroll').classList.remove('shifted');
}

function renderPanelContent(node) {
    let html = '';

    // Description
    if (node.desc) {
        html += `<p class="panel-desc">${node.desc}</p>`;
    }

    // Links / buttons
    if (node.links && node.links.length > 0) {
        html += `<hr class="panel-divider">`;
        html += `<p class="links-label">Knowledge Articles</p>`;
        html += `<div class="panel-links">`;
        node.links.forEach(link => {
            html += `
            <a class="sn-btn" href="${link.url}" target="_blank" rel="noopener noreferrer">
                <span class="btn-label">${link.label}</span>
                <span class="btn-arrow">→</span>
            </a>`;
        });
        html += `</div>`;
    } else {
        if (node.desc) html += `<hr class="panel-divider">`;
        html += `
        <div class="state-box">
            <div class="icon">🔗</div>
            <p><strong>Coming soon</strong></p>
            <p>Knowledge articles for this topic are being prepared and will be linked here shortly.</p>
        </div>`;
    }

    return html;
}

/* ──────────────────────────────────────────────────────────────
   KEYBOARD: Escape closes the panel
────────────────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && activeId) closePanel();
});

/* ──────────────────────────────────────────────────────────────
   INIT
────────────────────────────────────────────────────────────── */
buildMindMap();
</script>
</body>
</html>
